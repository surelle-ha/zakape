name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/studio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/studio/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      build_play_bundle:
        description: Build a signed Android App Bundle
        required: true
        default: false
        type: boolean
      play_track:
        description: Optionally upload the bundle to a configured Google Play track
        required: true
        default: none
        type: choice
        options:
          - none
          - internal
          - alpha
          - beta
          - production

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_NDK_VERSION: 27.2.12479018
  CARGO_TERM_COLOR: always

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:android:debug
      - name: Verify debug package
        id: apk
        shell: bash
        run: |
          apk="$(find apps/studio/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: zakape-android-debug-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
      - name: Attach APK to matching release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          target=''
          for attempt in {1..30}; do
            target="$(gh release view "$tag" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)"
            [ -n "$target" ] && break
            sleep 10
          done

          if [ "$target" != "$GITHUB_SHA" ]; then
            echo "::notice::Skipping release upload because $tag does not target $GITHUB_SHA."
            exit 0
          fi

          release_apk="$RUNNER_TEMP/Zakape-$version-android-arm64-debug.apk"
          cp "$APK_PATH" "$release_apk"
          gh release upload "$tag" "$release_apk#Android ARM64 debug APK" --clobber

  play-bundle:
    name: Signed Play bundle
    if: github.event_name == 'workflow_dispatch' && inputs.build_play_bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Configure release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required to build a Play bundle."
              exit 1
            fi
          done
          android_dir='apps/studio/src-tauri/gen/android'
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$android_dir/release-key.jks"
          {
            echo 'storeFile=release-key.jks'
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > "$android_dir/keystore.properties"
      - run: pnpm build:android:bundle
      - name: Verify release bundle
        id: bundle
        shell: bash
        run: |
          bundle="$(find apps/studio/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          test -n "$bundle"
          test -s "$bundle"
          # Upload keys are intentionally self-signed; verify the complete JAR signature
          # without treating that expected certificate warning as a build failure.
          jarsigner -verify "$bundle"
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: zakape-play-bundle-${{ github.sha }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30
      - name: Require Google Play credentials
        if: inputs.play_track != 'none'
        shell: bash
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is required to upload to Google Play.'
            exit 1
          fi
      - name: Upload to Google Play
        if: inputs.play_track != 'none'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.surelleha.zakape
          releaseFiles: ${{ steps.bundle.outputs.path }}
          track: ${{ inputs.play_track }}
          status: completed
