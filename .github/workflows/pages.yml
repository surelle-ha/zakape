name: Website — Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-website
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: cloudflare
      url: https://zakape.0110harold.workers.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @zakape/site build
        env:
          NUXT_APP_BASE_URL: /
          NUXT_PUBLIC_SITE_URL: https://zakape.0110harold.workers.dev
      - name: Deploy website to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          command: deploy --config wrangler.jsonc
