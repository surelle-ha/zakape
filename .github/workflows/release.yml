name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild, for example v0.2.0
        required: false
        type: string
      target:
        description: Platforms to rebuild
        required: true
        default: all
        type: choice
        options:
          - all
          - macos

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.please.outputs.release_created == 'true' || inputs.tag != '' }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_id: ${{ steps.metadata.outputs.release_id }}
      build_ref: ${{ steps.metadata.outputs.build_ref }}
      build_matrix: ${{ steps.targets.outputs.build_matrix }}
      macos_included: ${{ steps.targets.outputs.macos_included }}
    steps:
      - name: Prepare semantic release
        id: please
        if: inputs.tag == ''
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release metadata
        id: metadata
        if: steps.please.outputs.release_created == 'true' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || steps.please.outputs.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          AUTOMATED_REF: ${{ github.sha }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $env:TAG_NAME } | Select-Object -First 1
          if (-not $release) {
            throw "Release $env:TAG_NAME was not found."
          }
          if (-not $env:MANUAL_TAG) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -f target_commitish="$env:AUTOMATED_REF" | Out-Null
          }
          $buildRef = if ($env:MANUAL_TAG) { $release.target_commitish } else { $env:AUTOMATED_REF }
          "tag_name=$env:TAG_NAME" >> $env:GITHUB_OUTPUT
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          "build_ref=$buildRef" >> $env:GITHUB_OUTPUT
      - name: Select build targets
        id: targets
        if: steps.please.outputs.release_created == 'true' || inputs.tag != ''
        shell: bash
        env:
          MANUAL_TARGET: ${{ inputs.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          macos_ready=true
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              macos_ready=false
            fi
          done

          target="${MANUAL_TARGET:-all}"
          if [ "$target" = "macos" ]; then
            if [ "$macos_ready" != "true" ]; then
              echo "::error::A macOS rebuild requires all five Apple signing and notarization secrets."
              exit 1
            fi
            matrix='{"include":[{"platform":"macos-latest","build_args":"--target universal-apple-darwin"}]}'
            macos_included=true
          elif [ "$macos_ready" = "true" ]; then
            matrix='{"include":[{"platform":"macos-latest","build_args":"--target universal-apple-darwin"},{"platform":"ubuntu-22.04","build_args":""},{"platform":"windows-latest","build_args":""}]}'
            macos_included=true
          else
            echo "::warning::Apple release credentials are not configured. Publishing Windows and Linux without a macOS asset."
            matrix='{"include":[{"platform":"ubuntu-22.04","build_args":""},{"platform":"windows-latest","build_args":""}]}'
            macos_included=false
          fi

          echo "build_matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "macos_included=$macos_included" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    if: needs.release.outputs.release_ready == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.build_matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.build_ref }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
      - name: Install universal macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - name: Require macOS signing credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed and notarized macOS releases."
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm install --frozen-lockfile
      - name: Require updater signing credentials
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for signed updater artifacts."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required for signed updater artifacts."
          }
      - name: Build and upload native bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ZAKAPE_GOOGLE_DESKTOP_CLIENT_ID: ${{ vars.ZAKAPE_GOOGLE_DESKTOP_CLIENT_ID }}
          ZAKAPE_GOOGLE_DESKTOP_CLIENT_SECRET: ${{ secrets.ZAKAPE_GOOGLE_DESKTOP_CLIENT_SECRET }}
        with:
          projectPath: apps/studio
          releaseId: ${{ needs.release.outputs.release_id }}
          args: --features google-auth ${{ matrix.build_args }}
          uploadUpdaterJson: true
          retryAttempts: 2
      - name: Verify macOS signature and notarization
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app_path="apps/studio/src-tauri/target/universal-apple-darwin/release/bundle/macos/Zakape.app"
          executable="$app_path/Contents/MacOS/zakape"
          shopt -s nullglob
          dmgs=(apps/studio/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)

          test -d "$app_path"
          test -x "$executable"
          test "${#dmgs[@]}" -eq 1

          architectures="$(lipo -archs "$executable")"
          [[ " $architectures " == *" arm64 "* ]]
          [[ " $architectures " == *" x86_64 "* ]]

          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          xcrun stapler validate "${dmgs[0]}"

  android:
    name: Android APK
    needs: release
    if: needs.release.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.build_ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' "ndk;$ANDROID_NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:android:debug
      - name: Verify Android package
        id: apk
        shell: bash
        run: |
          apk="$(find apps/studio/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          version="${{ needs.release.outputs.tag_name }}"
          version="${version#v}"
          release_apk="$RUNNER_TEMP/Zakape-$version-android-arm64.apk"
          cp "$apk" "$release_apk"
          echo "path=$release_apk" >> "$GITHUB_OUTPUT"
      - name: Attach APK to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          apk_name="$(basename "$APK_PATH")"
          existing_asset_id="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
              --jq ".[] | select(.name == \"$apk_name\") | .id" | head -n 1
          )"

          if [ -n "$existing_asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$existing_asset_id"
          fi

          curl --fail-with-body --location \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$APK_PATH" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$apk_name" \
            >/dev/null

  publish:
    needs: [release, build, android]
    if: needs.release.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.release.outputs.release_id }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
          MACOS_INCLUDED: ${{ needs.release.outputs.macos_included }}
        run: |
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" | ConvertFrom-Json
          $startMarker = '<!-- zakape-macos-status:start -->'
          $endMarker = '<!-- zakape-macos-status:end -->'
          $pattern = "(?s)\r?\n?$([regex]::Escape($startMarker)).*?$([regex]::Escape($endMarker))"
          $body = [regex]::Replace([string]$release.body, $pattern, '').TrimEnd()
          if ($env:MACOS_INCLUDED -ne 'true') {
            $body += "`n`n$startMarker`n> **macOS:** A signed and notarized package is not included because Apple release credentials are not configured. Windows and Linux downloads are available.`n$endMarker"
          }
          $payload = @{ tag_name = $env:TAG_NAME; body = $body; draft = $false; prerelease = $false } | ConvertTo-Json
          $payload | gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" --input - | Out-Null
