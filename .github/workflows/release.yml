name: Desktop release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag to rebuild, for example v0.1.0
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_ready: ${{ steps.please.outputs.release_created == 'true' || inputs.tag != '' }}
      tag_name: ${{ steps.metadata.outputs.tag_name }}
      release_id: ${{ steps.metadata.outputs.release_id }}
      build_ref: ${{ steps.metadata.outputs.build_ref }}
    steps:
      - name: Prepare semantic release
        id: please
        if: inputs.tag == ''
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve release metadata
        id: metadata
        if: steps.please.outputs.release_created == 'true' || inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || steps.please.outputs.tag_name }}
          MANUAL_TAG: ${{ inputs.tag }}
          AUTOMATED_REF: ${{ github.sha }}
        run: |
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $release = $releases | Where-Object { $_.tag_name -eq $env:TAG_NAME } | Select-Object -First 1
          if (-not $release) {
            throw "Release $env:TAG_NAME was not found."
          }
          if ($env:MANUAL_TAG -and -not $release.draft) {
            throw "Release $env:TAG_NAME is already published; only draft releases can be rebuilt."
          }
          if (-not $env:MANUAL_TAG) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -f target_commitish="$env:AUTOMATED_REF" | Out-Null
          }
          $buildRef = if ($env:MANUAL_TAG) { $release.target_commitish } else { $env:AUTOMATED_REF }
          "tag_name=$env:TAG_NAME" >> $env:GITHUB_OUTPUT
          "release_id=$($release.id)" >> $env:GITHUB_OUTPUT
          "build_ref=$buildRef" >> $env:GITHUB_OUTPUT

  build:
    needs: release
    if: needs.release.outputs.release_ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            build_args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            build_args: ''
          - platform: windows-latest
            build_args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.build_ref }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          version: 10.17.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install universal macOS targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/studio/src-tauri -> target
      - name: Require macOS signing credentials
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for signed and notarized macOS releases."
              missing=1
            fi
          done
          exit "$missing"
      - run: pnpm install --frozen-lockfile
      - name: Build and upload native bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: apps/studio
          releaseId: ${{ needs.release.outputs.release_id }}
          args: ${{ matrix.build_args }}
          uploadUpdaterJson: false
          retryAttempts: 2

  publish:
    needs: [release, build]
    if: needs.release.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: |
          release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq --arg tag "$TAG_NAME" -r '.[] | select(.tag_name == $tag) | .id')
          test -n "$release_id"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" -F draft=false -F prerelease=false
