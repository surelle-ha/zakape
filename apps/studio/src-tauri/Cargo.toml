[package]
name = "zakape"
version = "0.13.1"
description = "An open-source pixel art and sprite animation workbench"
authors = ["Zakape contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/surelle-ha/zakape"

[lib]
name = "zakape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
google-auth = [
  "dep:base64",
  "dep:getrandom",
  "dep:keyring",
  "dep:open",
  "dep:sha2",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ah-asefile = "0.4.1"
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }
image = { version = "0.25", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.dev.package.ah-asefile]
opt-level = 2

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "4.2.0", optional = true }
open = { version = "5.3.2", optional = true }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
