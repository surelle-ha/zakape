[package]
name = "zakape"
version = "0.3.0"
description = "An open-source pixel art and sprite animation workbench"
authors = ["Zakape contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/surelle-ha/zakape"

[lib]
name = "zakape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
