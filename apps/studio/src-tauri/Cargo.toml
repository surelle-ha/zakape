[package]
name = "zakape"
version = "0.1.0"
description = "An open-source pixel art and sprite animation workbench"
authors = ["Zakape contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/surelle-ha/zakape"

[lib]
name = "zakape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
